apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders-kargo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"  # Before orders-api apps
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: orders-project

  source:
    repoURL: https://github.com/AaronStahley/orders-gitops.git
    targetRevision: main
    path: kargo

  destination:
    server: https://kubernetes.default.svc
    namespace: orders

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
