apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders-api-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    kargo.akuity.io/authorized-stage: orders:dev
spec:
  project: orders-project
  source:
    repoURL: https://github.com/AaronStahley/orders-gitops.git
    targetRevision: stage/dev
    path: manifests/orders-api/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: orders-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
