apiVersion: platform.aaronstahley.dev/v1alpha1
kind: WebApi
metadata:
  name: orders-api
spec:
  replicas: 2
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
  env:
    - name: PODINFO_UI_MESSAGE
      value: orders-api (qa)
    - name: PODINFO_UI_COLOR
      value: "#6b46c1"
