apiVersion: platform.aaronstahley.dev/v1alpha1
kind: WebApi
metadata:
  name: orders-api
spec:
  replicas: 1
  resources:
    requests:
      memory: 32Mi
      cpu: 25m
    limits:
      memory: 64Mi
      cpu: 100m
  env:
    - name: PODINFO_UI_MESSAGE
      value: orders-api (dev)
    - name: PODINFO_UI_COLOR
      value: "#2b6cb0"
